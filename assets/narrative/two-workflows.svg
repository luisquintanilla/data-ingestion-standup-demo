<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850">
  <rect width="1440" height="850" fill="#f8fafc"/>
  <g font-family="Helvetica">
    <text x="70" y="65" font-size="36" font-weight="700" fill="#172033">One app. Two workflows.</text>
    <text x="70" y="105" font-size="22" fill="#526075">Prepare documents first; retrieve evidence when a question arrives.</text>
    <text x="70" y="163" font-size="23" font-weight="700" fill="#334155">PREPARATION</text>
    <g fill="#ffffff" stroke="#bac5d4" stroke-width="2">
      <rect x="70" y="190" width="180" height="110" rx="14"/>
      <rect x="295" y="190" width="195" height="110" rx="14"/>
      <rect x="535" y="190" width="195" height="110" rx="14"/>
      <rect x="1020" y="190" width="350" height="110" rx="14"/>
    </g>
    <rect x="775" y="190" width="200" height="110" rx="14" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
    <g font-size="26" font-weight="700" fill="#172033" text-anchor="middle">
      <text x="160" y="236" font-size="26" font-weight="700" fill="#172033" text-anchor="middle">Files</text>
      <text x="392" y="236" font-size="26" font-weight="700" fill="#172033" text-anchor="middle">Extract</text>
      <text x="632" y="236" font-size="26" font-weight="700" fill="#172033" text-anchor="middle">Chunk</text>
      <text x="875" y="236" font-size="26" font-weight="700" fill="#42209e" text-anchor="middle">Embed</text>
      <text x="1195" y="236" font-size="26" font-weight="700" fill="#172033" text-anchor="middle">Evidence index</text>
    </g>
    <g font-size="19" fill="#526075" text-anchor="middle">
      <text x="160" y="272" font-size="19" fill="#526075" text-anchor="middle">PDF input</text>
      <text x="392" y="272" font-size="19" fill="#526075" text-anchor="middle">Documents result</text>
      <text x="632" y="272" font-size="19" fill="#526075" text-anchor="middle">MEDI</text>
      <text x="875" y="272" font-size="19" fill="#526075" text-anchor="middle">MEAI</text>
      <text x="1195" y="272" font-size="19" fill="#526075" text-anchor="middle">Text + sources + vectors</text>
    </g>
    <g stroke="#64748b" stroke-width="3">
      <line x1="250" y1="245" x2="279" y2="245"/>
      <line x1="490" y1="245" x2="519" y2="245"/>
      <line x1="730" y1="245" x2="759" y2="245"/>
      <line x1="975" y1="245" x2="1004" y2="245"/>
    </g>
    <g fill="#64748b">
      <polygon points="279,238 292,245 279,252"/>
      <polygon points="519,238 532,245 519,252"/>
      <polygon points="759,238 772,245 759,252"/>
      <polygon points="1004,238 1017,245 1004,252"/>
    </g>
    <text x="70" y="343" font-size="21" fill="#526075">Our adapter projects supported content into MEDI units and carries document/page associations.</text>
    <path d="M1195 302 V405 H632 V472" fill="none" stroke="#8b78c8" stroke-width="3" stroke-dasharray="9 7"/>
    <polygon points="625,472 632,485 639,472" fill="#8b78c8"/>
    <text x="1000" y="390" font-size="20" fill="#6d55a6">same index</text>
    <text x="70" y="450" font-size="23" font-weight="700" fill="#334155">ANSWERING</text>
    <g fill="#ffffff" stroke="#bac5d4" stroke-width="2">
      <rect x="70" y="490" width="180" height="125" rx="14"/>
      <rect x="535" y="490" width="195" height="125" rx="14"/>
      <rect x="1020" y="490" width="350" height="125" rx="14"/>
    </g>
    <g fill="#ede9fe" stroke="#c4b5fd" stroke-width="2">
      <rect x="295" y="490" width="195" height="125" rx="14"/>
      <rect x="775" y="490" width="200" height="125" rx="14"/>
    </g>
    <g font-size="26" font-weight="700" text-anchor="middle">
      <text x="160" y="538" font-size="26" font-weight="700" fill="#172033" text-anchor="middle">Question</text>
      <text x="392" y="538" font-size="26" font-weight="700" fill="#42209e" text-anchor="middle">Embed</text>
      <text x="632" y="538" font-size="26" font-weight="700" fill="#172033" text-anchor="middle">Retrieve</text>
      <text x="875" y="538" font-size="26" font-weight="700" fill="#42209e" text-anchor="middle">Chat</text>
      <text x="1195" y="532" font-size="26" font-weight="700" fill="#172033" text-anchor="middle">Answer + sources</text>
    </g>
    <g font-size="18" fill="#526075" text-anchor="middle">
      <text x="160" y="574" font-size="18" fill="#526075" text-anchor="middle">User input</text>
      <text x="392" y="574" font-size="18" fill="#526075" text-anchor="middle">MEAI</text>
      <text x="632" y="574" font-size="18" fill="#526075" text-anchor="middle">VectorData</text>
      <text x="875" y="574" font-size="18" fill="#526075" text-anchor="middle">IChatClient</text>
      <text x="1195" y="565" font-size="18" fill="#526075" text-anchor="middle">Model text plus actual</text>
      <text x="1195" y="590" font-size="18" fill="#526075" text-anchor="middle">retrieved records</text>
    </g>
    <g stroke="#64748b" stroke-width="3">
      <line x1="250" y1="550" x2="279" y2="550"/>
      <line x1="490" y1="550" x2="519" y2="550"/>
      <line x1="730" y1="550" x2="759" y2="550"/>
      <line x1="975" y1="550" x2="1004" y2="550"/>
    </g>
    <g fill="#64748b">
      <polygon points="279,543 292,550 279,557"/>
      <polygon points="519,543 532,550 519,557"/>
      <polygon points="759,543 772,550 759,557"/>
      <polygon points="1004,543 1017,550 1004,557"/>
    </g>
    <text x="70" y="660" font-size="22" fill="#334155">IEmbeddingGenerator serves both paths; stored passages and queries must use a compatible embedding space.</text>
    <text x="70" y="700" font-size="22" fill="#334155">The app supplies candidate evidence to chat and exposes the retrieved records for inspection.</text>
    <line x1="70" y1="745" x2="1370" y2="745" stroke="#cbd5e1" stroke-width="2"/>
    <text x="70" y="783" font-size="19" fill="#526075">Architecture illustration, not a successful-run recording. Extraction capability and remote calls depend on the selected provider.</text>
    <text x="70" y="815" font-size="19" fill="#526075">The current prototype's live embedding, learned retrieval and chat path remain unverified.</text>
  </g>
</svg>
